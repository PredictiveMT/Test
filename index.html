<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>预测性维修智能分析平台 V6</title>

<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    background:#001529;
    color:white;
    font-family:"Microsoft YaHei";
}

h1{
    text-align:center;
}

.kpi{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#0b2440;
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.card h3{
    color:#91caff;
    font-size:14px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.panel{
    background:#0b2440;
    border-radius:8px;
    padding:15px;
    margin-top:20px;
}

.chart{
    height:450px;
}

.grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003a70;
    padding:8px;
}

td{
    padding:8px;
    text-align:center;
    border-bottom:1px solid #1f466b;
}

.good{
    background:#164d1d;
}

.warn{
    background:#6f5710;
}

.bad{
    background:#5b1a1a;
}

.advice{
    background:#002140;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}

</style>
</head>

<body>

<h1>预测性维修智能分析平台 V6</h1>

<div class="kpi">

<div class="card">
<h3>设备总数</h3>
<p id="total">0</p>
</div>

<div class="card">
<h3>高风险</h3>
<p id="critical">0</p>
</div>

<div class="card">
<h3>预警设备</h3>
<p id="warning">0</p>
</div>

<div class="card">
<h3>健康设备</h3>
<p id="healthy">0</p>
</div>

<div class="card">
<h3>平均风险指数</h3>
<p id="avgRisk">0</p>
</div>

<div class="card">
<h3>平均趋势评分</h3>
<p id="avgTrend">0</p>
</div>

</div>

<div class="panel">
<h3>设备综合健康度排行</h3>
<div id="healthChart" class="chart"></div>
</div>

<div class="grid2">

<div class="panel">
<h3>风险指数仪表盘</h3>
<div id="gaugeChart" class="chart"></div>
</div>

<div class="panel">
<h3>品牌健康度分析</h3>
<div id="brandChart" class="chart"></div>
</div>

</div>

<div class="panel">

<h3>设备测量项健康矩阵</h3>

<table>

<thead>
<tr>
<th>设备</th>
<th>跳动</th>
<th>磨损</th>
<th>拉刀力</th>
<th>间隙</th>
<th>风险指数</th>
<th>健康度</th>
</tr>
</thead>

<tbody id="matrixBody"></tbody>

</table>

</div>

<div class="grid2">

<div class="panel">
<h3>主轴跳动TOP10</h3>
<div id="runoutChart" class="chart"></div>
</div>

<div class="panel">
<h3>主轴磨损TOP10</h3>
<div id="wearChart" class="chart"></div>
</div>

</div>

<div class="grid2">

<div class="panel">

<h3>设备健康雷达图</h3>

<div id="radarChart" class="chart"></div>

</div>

<div class="panel">

<h3>TOP10风险设备</h3>

<table>

<thead>
<tr>
<th>设备</th>
<th>健康度</th>
<th>风险指数</th>
<th>风险</th>
</tr>
</thead>

<tbody id="riskBody"></tbody>

</table>

</div>

</div>

<div class="panel">

<h3>AI维修建议</h3>

<div id="adviceBox"></div>

</div>

<script>

function scoreClass(v){

    if(v < 70) return "bad";

    if(v < 85) return "warn";

    return "good";

}

fetch("data.json")

.then(r=>r.json())

.then(data=>{

document.getElementById("total").innerText =
data.total;

document.getElementById("critical").innerText =
data.critical;

document.getElementById("warning").innerText =
data.warning;

document.getElementById("healthy").innerText =
data.total-data.critical-data.warning;

let avgRisk =
data.devices.reduce(
(a,b)=>a+b.risk_index,0
)/data.devices.length;

let avgTrend =
data.devices.reduce(
(a,b)=>a+b.trend_score,0
)/data.devices.length;

document.getElementById("avgRisk")
.innerText=
avgRisk.toFixed(1);

document.getElementById("avgTrend")
.innerText=
avgTrend.toFixed(1);

let healthChart =
echarts.init(
document.getElementById("healthChart")
);

healthChart.setOption({

tooltip:{},

xAxis:{
type:'category',
data:data.devices.map(
x=>x.device
),
axisLabel:{
rotate:45
}
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:data.devices.map(
x=>x.overall
)

}]

});

let gauge =
echarts.init(
document.getElementById("gaugeChart")
);

gauge.setOption({

series:[{

type:'gauge',

progress:{
show:true
},

detail:{
formatter:'{value}'
},

data:[{
value:Number(
avgRisk.toFixed(1)
)
}]

}]

});

let brandMap={};

data.devices.forEach(d=>{

if(!brandMap[d.brand]){

brandMap[d.brand]=[];

}

brandMap[d.brand]
.push(d.overall);

});

let brandData=[];

for(let b in brandMap){

let avg=

brandMap[b].reduce(
(a,c)=>a+c,0
)

/

brandMap[b].length;

brandData.push({

name:b,

value:Number(
avg.toFixed(1)
)

});

}

let brandChart =
echarts.init(
document.getElementById("brandChart")
);

brandChart.setOption({

tooltip:{},

series:[{

type:'pie',

radius:'70%',

data:brandData

}]

});

let body=
document.getElementById(
"matrixBody"
);

data.devices.forEach(d=>{

body.innerHTML += `

<tr>

<td>${d.device}</td>

<td class="${scoreClass(d.runout_score)}">
${d.runout_score}
</td>

<td class="${scoreClass(d.wear_score)}">
${d.wear_score}
</td>

<td class="${scoreClass(d.tool_force_score)}">
${d.tool_force_score}
</td>

<td class="${scoreClass(d.backlash_score)}">
${d.backlash_score}
</td>

<td>${d.risk_index}</td>

<td class="${scoreClass(d.overall)}">
${d.overall}
</td>

</tr>

`;

});

let top10 =
data.devices.slice(0,10);

let runoutChart =
echarts.init(
document.getElementById("runoutChart")
);

runoutChart.setOption({

xAxis:{
type:'category',
data:top10.map(x=>x.device)
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:top10.map(
x=>x.runout_score
)

}]

});

let wearChart =
echarts.init(
document.getElementById("wearChart")
);

wearChart.setOption({

xAxis:{
type:'category',
data:top10.map(x=>x.device)
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:top10.map(
x=>x.wear_score
)

}]

});

let radar =
echarts.init(
document.getElementById("radarChart")
);

function drawRadar(d){

radar.setOption({

radar:{

indicator:[

{name:'跳动',max:100},

{name:'磨损',max:100},

{name:'拉刀力',max:100},

{name:'间隙',max:100}

]

},

series:[{

type:'radar',

areaStyle:{},

data:[{

value:[

d.runout_score,

d.wear_score,

d.tool_force_score,

d.backlash_score

],

name:d.device

}]

}]

});

}

drawRadar(
data.devices[0]
);

healthChart.on(
'click',
function(p){

let d =
data.devices.find(
x=>x.device===p.name
);

if(d){

drawRadar(d);

}

});

let riskBody=
document.getElementById(
"riskBody"
);

top10.forEach(d=>{

riskBody.innerHTML += `

<tr>

<td>${d.device}</td>

<td>${d.overall}</td>

<td>${d.risk_index}</td>

<td>${d.risk}</td>

</tr>

`;

});

let advice=
document.getElementById(
"adviceBox"
);

top10.forEach(d=>{

advice.innerHTML += `

<div class="advice">

<b>${d.device}</b>

<br>

健康度：
${d.overall}

<br>

风险指数：
${d.risk_index}

<br>

趋势评分：
${d.trend_score}

<br>

建议：
${d.suggestion}

</div>

`;

});

});

</script>

</body>
</html>
