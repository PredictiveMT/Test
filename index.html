<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>预测性维修智能分析平台 V4</title>

<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei";
}

body{
background:#001529;
color:white;
padding:20px;
}

.header{
font-size:38px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.kpi{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:15px;
margin-bottom:20px;
}

.card{
background:#0b2440;
border-radius:10px;
padding:20px;
text-align:center;
}

.card h3{
font-size:15px;
margin-bottom:10px;
color:#91caff;
}

.value{
font-size:32px;
font-weight:bold;
}

.panel{
background:#0b2440;
border-radius:10px;
padding:15px;
margin-bottom:20px;
}

.panel-title{
font-size:18px;
color:#91caff;
margin-bottom:10px;
}

.chart{
height:400px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
padding:10px;
background:#003a70;
}

td{
padding:8px;
text-align:center;
border-bottom:1px solid #1e3e63;
}

.high{
color:#ff4d4f;
font-weight:bold;
}

.medium{
color:#faad14;
font-weight:bold;
}

.low{
color:#52c41a;
font-weight:bold;
}

.matrix-red{
background:#5b1a1a;
}

.matrix-yellow{
background:#6b5311;
}

.matrix-green{
background:#164d1d;
}

.main{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.advice-item{
background:#002140;
padding:10px;
margin-bottom:10px;
border-radius:6px;
line-height:1.8;
}

</style>

</head>

<body>

<div class="header">
预测性维修智能分析平台
</div>

<div class="kpi">

<div class="card">
<h3>设备总数</h3>
<div class="value" id="total">0</div>
</div>

<div class="card">
<h3>高风险</h3>
<div class="value" id="critical" style="color:#ff4d4f">0</div>
</div>

<div class="card">
<h3>预警设备</h3>
<div class="value" id="warning" style="color:#faad14">0</div>
</div>

<div class="card">
<h3>健康设备</h3>
<div class="value" id="healthy" style="color:#52c41a">0</div>
</div>

<div class="card">
<h3>平均风险指数</h3>
<div class="value" id="avgRisk">0</div>
</div>

<div class="card">
<h3>平均趋势评分</h3>
<div class="value" id="avgTrend">0</div>
</div>

</div>

<div class="panel">
<div class="panel-title">综合健康度排行</div>
<div id="healthChart" class="chart"></div>
</div>

<div class="panel">

<div class="panel-title">
设备测量项健康度矩阵
</div>

<table id="matrixTable">

<tr>
<th>设备</th>
<th>跳动</th>
<th>磨损</th>
<th>拉刀力</th>
