<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>预测性维修智能分析平台</title>

<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei";
}

body{
    background:#001529;
    color:white;
    padding:20px;
}

.header{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin-bottom:20px;
}

.kpi{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#0b2440;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,153,255,.2);
}

.card h3{
    margin-bottom:10px;
    color:#91caff;
}

.card .value{
    font-size:36px;
    font-weight:bold;
}

.main{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    background:#0b2440;
    border-radius:10px;
    padding:15px;
}

.panel-title{
    font-size:18px;
    margin-bottom:10px;
    color:#91caff;
}

#healthChart{
    width:100%;
    height:500px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003a70;
    padding:10px;
}

td{
    padding:8px;
    border-bottom:1px solid #13395f;
    text-align:center;
}

.high{
    color:#ff4d4f;
}

.medium{
    color:#faad14;
}

.low{
    color:#52c41a;
}

.advice{
    margin-top:20px;
    line-height:2;
}

.advice-item{
    padding:8px;
    margin-bottom:8px;
    background:#002140;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="header">
预测性维修智能分析平台
</div>

<div class="kpi">

<div class="card">
<h3>设备总数</h3>
<div class="value" id="total">0</div>
</div>

<div class="card">
<h3>高风险设备</h3>
<div class="value" id="critical" style="color:#ff4d4f">0</div>
</div>

<div class="card">
<h3>预警设备</h3>
<div class="value" id="warning" style="color:#faad14">0</div>
</div>

<div class="card">
<h3>健康设备</h3>
<div class="value" id="healthy" style="color:#52c41a">0</div>
</div>

</div>

<div class="main">

<div class="panel">

<div class="panel-title">
设备健康度排行
</div>

<div id="healthChart"></div>

</div>

<div>

<div class="panel">

<div class="panel-title">
风险设备TOP10
</div>

<table id="riskTable">

<tr>
<th>设备</th>
<th>健康度</th>
<th>风险</th>
</tr>

</table>

</div>

<div class="panel advice">

<div class="panel-title">
AI维修建议
</div>

<div id="adviceBox"></div>

</div>

</div>

</div>

<script>

fetch("data.json")
.then(res=>res.json())
.then(data=>{

document.getElementById("total").innerText =
data.total;

document.getElementById("critical").innerText =
data.critical;

document.getElementById("warning").innerText =
data.warning;

document.getElementById("healthy").innerText =
data.total - data.warning - data.critical;

const chart = echarts.init(
document.getElementById("healthChart")
);

chart.setOption({

tooltip:{},

grid:{
left:'5%',
right:'2%',
bottom:'15%'
},

xAxis:{
type:'category',
axisLabel:{
rotate:45
},
data:data.devices.map(x=>x.device)
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:data.devices.map(x=>x.health),

itemStyle:{
color:function(params){

let v=params.value;

if(v<70)
return '#ff4d4f';

if(v<85)
return '#faad14';

return '#52c41a';

}
}

}]

});

const table =
document.getElementById("riskTable");

data.devices.slice(0,10).forEach(item=>{

let riskClass="low";

if(item.risk==="高")
riskClass="high";

if(item.risk==="中")
riskClass="medium";

table.innerHTML += `

<tr>
<td>${item.device}</td>
<td>${item.health}</td>
<td class="${riskClass}">
${item.risk}
</td>
</tr>

`;

});

const adviceBox =
document.getElementById("adviceBox");

data.devices
.filter(x=>x.risk!=="低")
.slice(0,10)
.forEach(item=>{

adviceBox.innerHTML += `

<div class="advice-item">

<b>${item.device}</b>

<br>

健康度：${item.health}

<br>

建议：${item.suggestion}

</div>

`;

});

});

</script>

</body>

</html>
