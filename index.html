<style>

grid*template-columns:repeat(6,1fr);
ga*:15px;

}

}

font-size:14px;
*argin-bottom:10px;
color:#91caff;
*

.value{
font-size:28px;

}

.panel{
background:#0b*440;
border-radius:10px;

}

.panel-*itle{
font-size:18px;

}

.chart{
h*ight:450px;

}

*idth:100%;
border-collapse:collaps*;
}

th{

background:*003a70;
}

td{
padding:8px;

}

background:#1*4d1d;
}

.yellow{
background:#6f57*0;

display:grid;
grid-template*columns:2fr 1fr;

background:#002140;

grid-template-columns:1fr;
*

}

</style>

</head>

<body>

<d*v class="header">
预测性维修智能分析平台
</di*>

<div class="kpi">

<div class="*ard">
<h3>设备总数</h3>
<div id="total* class="value">0</div>
</div>

<di* class="card">
<h3>高风险设备</h3>
<div*id="critical" class="value" style=*color:#ff4d4f">0</div>
</div>

<di* class="card">
<h3>预警设备</h3>
<div *d="warning" class="value" style="c*lor:#faad14">0</div>
</div>

<div *lass="card">
<h3>健康设备</h3>
<div id*"healthy" class="value" style="col*r:#52c41a">0</div>
</div>

<div cl*ss="card">
<h3>平均风险指数</h3>
<div id*"avgRisk" class="value">0</div>
</*iv>

<div class="card">
<h3>平均趋势评分*/h3>
<div id="avgTrend" class="val*e">0</div>
</div>

</div>

<div cl*ss="panel">
<div class="panel-titl*">综合健康度排行</div>
<div id="healthCha*t" class="chart"></div>
</div>

<d*v class="panel">
<div class="panel*title">设备测量项健康矩阵</div>

<table id=*matrixTable">

<thead>
<tr>
<th>设备*/th>
<th>跳动</th>
<th>磨损</th>
<th>拉*力</th>
<th>间隙</th>
<th>综合</th>
</t*>
</thead>

<tbody>
</tbody>

</table>

</div>

<div class="main">

<div>

<div class="panel">

<div class="panel-title">
设备健康雷达图
</div>

<div id="radarChart" class="chart"></div>

</div>

</div>

<div>

<div class="panel">

<div class="panel-title">
TOP10风险设备
</div>

<table id="riskTable">

<thead>
<tr>
<th>设备</th>
<th>健康度</th>
<th>风险指数</th>
<th>风险</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</div>

<div class="panel">

<div class="panel-title">
AI维修建议
</div>

<div id="adviceBox"></div>

</div>

</div>

</div>

<script>

function scoreClass(v){

if(v < 70) return "red";

if(v < 85) return "yellow";

return "green";

}

fetch("data.json")

.then(r=>r.json())

.then(data=>{

document.getElementById("total").innerText =
data.total || 0;

document.getElementById("critical").innerText =
data.critical || 0;

document.getElementById("warning").innerText =
data.warning || 0;

document.getElementById("healthy").innerText =
(data.total||0) -
(data.critical||0) -
(data.warning||0);

const avgRisk =
data.devices.reduce(
(a,b)=>a+(b.risk_index||0),
0
) / data.devices.length;

const avgTrend =
data.devices.reduce(
(a,b)=>a+(b.trend_score||0),
0
) / data.devices.length;

document.getElementById("avgRisk").innerText =
avgRisk.toFixed(1);

document.getElementById("avgTrend").innerText =
avgTrend.toFixed(1);

const chart =
echarts.init(
document.getElementById("healthChart")
);

chart.setOption({

tooltip:{},

xAxis:{
type:'category',
data:data.devices.map(
x=>x.device
),
axisLabel:{
rotate:45
}
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:data.devices.map(
x=>x.overall
),

itemStyle:{
color:function(p){

if(p.value < 70)
return '#ff4d4f';

if(p.value < 85)
return '#faad14';

return '#52c41a';

}
}

}]

});

const tbody =
document.querySelector("#matrixTable tbody");

data.devices.forEach(d=>{

tbody.innerHTML += `

<tr>

<td>${d.device}</td>

<td class="${scoreClass(d.runout_score)}">
${d.runout_score}
</td>

<td class="${scoreClass(d.wear_score)}">
${d.wear_score}
</td>

<td class="${scoreClass(d.tool_force_score)}">
${d.tool_force_score}
</td>

<td class="${scoreClass(d.backlash_score)}">
${d.backlash_score}
</td>

<td class="${scoreClass(d.overall)}">
${d.overall}
</td>

</tr>

`;

});

const riskBody =
document.querySelector("#riskTable tbody");

data.devices
.slice(0,10)
.forEach(d=>{

riskBody.innerHTML += `

<tr>

<td>${d.device}</td>

<td>${d.overall}</td>

<td>${d.risk_index}</td>

<td>${d.risk}</td>

</tr>

`;

});

const advice =
document.getElementById("adviceBox");

data.devices
.slice(0,10)
.forEach(d=>{

advice.innerHTML += `

<div class="advice-item">

<b>${d.device}</b>

<br>

综合健康度：
${d.overall}

<br>

趋势评分：
${d.trend_score}

<br>

风险指数：
${d.risk_index}

<br>

建议：
${d.suggestion}

</div>

`;

});

const radar =
echarts.init(
document.getElementById("radarChart")
);

function drawRadar(d){

radar.setOption({

tooltip:{},

radar:{

indicator:[

{name:'主轴跳动',max:100},

{name:'主轴磨损',max:100},

{name:'拉刀力',max:100},

{name:'反向间隙',max:100}

]

},

series:[{

type:'radar',

data:[{

value:[

d.runout_score,

d.wear_score,

d.tool_force_score,

d.backlash_score

],

name:d.device

}]

}]

});

}

drawRadar(data.devices[0]);

chart.on("click",function(p){

const d =
data.devices.find(
x=>x.device===p.name
);

if(d){
drawRadar(d);
}

});

})

.catch(err=>{

console.error(err);

alert(
"读取 data.json 失败，请按F12查看控制台。"
);

});

</script>

</body>
</html>
