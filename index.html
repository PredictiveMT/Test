<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>预测性维修平台</title>

<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>

body{
    background:#001529;
    color:white;
    font-family:Microsoft YaHei;
}

h1{
    text-align:center;
    margin-top:30px;
}

#healthChart{
    width:100%;
    height:600px;
}

</style>

</head>

<body>

<h1>预测性维修平台</h1>

<div id="healthChart"></div>

<script>

fetch("data.json")
.then(res=>res.json())
.then(data=>{

    const chart = echarts.init(
        document.getElementById("healthChart")
    );

    chart.setOption({

        tooltip:{},

        xAxis:{
            type:"category",
            data:data.devices.map(
                x=>x.device
            )
        },

        yAxis:{
            max:100
        },

        series:[{

            type:"bar",

            data:data.devices.map(
                x=>x.health
            ),

            itemStyle:{

                color:function(params){

                    let v=params.value;

                    if(v<70)
                        return "#ff4d4f";

                    if(v<85)
                        return "#faad14";

                    return "#52c41a";

                }

            }

        }]

    });

});

</script>

</body>

</html>
