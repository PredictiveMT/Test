<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>预测性维修智能分析平台</title>

<script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei";
}

body{
    background:#001529;
    color:white;
    padding:20px;
}

.header{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin-bottom:20px;
}

.kpi{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#0b2440;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,150,255,.2);
}

.card h3{
    color:#91caff;
    margin-bottom:10px;
}

.card .value{
    font-size:36px;
    font-weight:bold;
}

.main{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    background:#0b2440;
    border-radius:10px;
    padding:15px;
}

.panel-title{
    color:#91caff;
    margin-bottom:10px;
    font-size:18px;
}

#healthChart{
    width:100%;
    height:500px;
}

#radarChart{
    width:100%;
    height:350px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003a70;
    padding:10px;
}

td{
    padding:8px;
    text-align:center;
    border-bottom:1px solid #1f466b;
}

.high{
    color:#ff4d4f;
    font-weight:bold;
}

.medium{
    color:#faad14;
    font-weight:bold;
}

.low{
    color:#52c41a;
    font-weight:bold;
}

#adviceBox{
    margin-top:10px;
}

.advice-item{
    background:#002140;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
}

@media(max-width:1200px){

.main{
grid-template-columns:1fr;
}

.kpi{
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>

<div class="header">
预测性维修智能分析平台
</div>

<div class="kpi">

<div class="card">
<h3>设备总数</h3>
<div class="value" id="total">0</div>
</div>

<div class="card">
<h3>高风险设备</h3>
<div class="value" id="critical" style="color:#ff4d4f">0</div>
</div>

<div class="card">
<h3>预警设备</h3>
<div class="value" id="warning" style="color:#faad14">0</div>
</div>

<div class="card">
<h3>健康设备</h3>
<div class="value" id="healthy" style="color:#52c41a">0</div>
</div>

</div>

<div class="main">

<div>

<div class="panel">

<div class="panel-title">
设备综合健康度排行
</div>

<div id="healthChart"></div>

</div>

</div>

<div>

<div class="panel">

<div class="panel-title">
TOP10风险设备
</div>

<table id="riskTable">

<tr>
<th>设备</th>
<th>健康度</th>
<th>风险</th>
</tr>

</table>

</div>

<br>

<div class="panel">

<div class="panel-title">
设备健康雷达图
</div>

<div id="radarChart"></div>

</div>

<br>

<div class="panel">

<div class="panel-title">
AI维修建议
</div>

<div id="adviceBox"></div>

</div>

</div>

</div>

<script>

let allData = null;

fetch("data.json")

.then(res=>res.json())

.then(data=>{

allData = data;

document.getElementById("total").innerText =
data.total;

document.getElementById("critical").innerText =
data.critical;

document.getElementById("warning").innerText =
data.warning;

document.getElementById("healthy").innerText =
data.total-data.critical-data.warning;

const chart = echarts.init(
document.getElementById("healthChart")
);

chart.setOption({

tooltip:{},

grid:{
left:'5%',
right:'3%',
bottom:'18%'
},

xAxis:{
type:'category',
axisLabel:{
rotate:45
},
data:data.devices.map(
x=>x.device
)
},

yAxis:{
max:100
},

series:[{

type:'bar',

data:data.devices.map(
x=>x.overall
),

itemStyle:{

color:function(param){

let v = param.value;

if(v < 70)
return '#ff4d4f';

if(v < 85)
return '#faad14';

return '#52c41a';
}

}

}]

});

chart.on('click',function(params){

let deviceName=params.name;

let d=data.devices.find(
x=>x.device===deviceName
);

drawRadar(d);

});

drawRadar(data.devices[0]);

const table=
document.getElementById("riskTable");

data.devices
.slice(0,10)
.forEach(item=>{

let cls="low";

if(item.risk==="高")
cls="high";

if(item.risk==="中")
cls="medium";

table.innerHTML +=
`<tr>
<td>${item.device}</td>
<td>${item.overall}</td>
<td class="${cls}">
${item.risk}
</td>
</tr>`;

});

const advice=
document.getElementById("adviceBox");

data.devices
.filter(x=>x.risk!=="低")
.slice(0,10)

.forEach(item=>{

advice.innerHTML +=

`<div class="advice-item">

<b>${item.device}</b>

<br>

健康度：${item.overall}

<br>

建议：${item.suggestion}

</div>`;

});

});

function drawRadar(d){

const radar=echarts.init(
document.getElementById("radarChart")
);

radar.setOption({

tooltip:{},

radar:{
indicator:[

{
name:'主轴跳动',
max:100
},

{
name:'主轴磨损',
max:100
},

{
name:'拉刀力',
max:100
},

{
name:'反向间隙',
max:100
}

]
},

series:[{

type:'radar',

data:[{

value:[

d.runout,

d.wear,

d.tool_force,

d.backlash

],

name:d.device

}]

}]

});

}

</script>

</body>

</html>
