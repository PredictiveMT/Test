<script>

fetch("data.json")
.then(response => response.json())
.then(data => {

    console.log(data);

    // KPI

    document.getElementById("total").innerHTML =
        data.total;

    document.getElementById("critical").innerHTML =
        data.critical;

    document.getElementById("warning").innerHTML =
        data.warning;

    document.getElementById("healthy").innerHTML =
        data.total -
        data.critical -
        data.warning;

    // 平均风险指数

    let avgRisk =
        data.devices.reduce(
            (sum,d)=>sum+d.risk_index,
            0
        ) / data.devices.length;

    document.getElementById("avgRisk").innerHTML =
        avgRisk.toFixed(1);

    // 平均趋势评分

    let avgTrend =
        data.devices.reduce(
            (sum,d)=>sum+d.trend_score,
            0
        ) / data.devices.length;

    document.getElementById("avgTrend").innerHTML =
        avgTrend.toFixed(1);

    // 健康度排行

    const healthChart =
        echarts.init(
            document.getElementById("healthChart")
        );

    healthChart.setOption({

        tooltip:{},

        xAxis:{
            type:"category",
            data:data.devices.map(
                x=>x.device
            ),
            axisLabel:{
                rotate:45
            }
        },

        yAxis:{
            max:100
        },

        series:[{

            type:"bar",

            data:data.devices.map(
                x=>x.overall
            ),

            itemStyle:{
                color:function(p){

                    if(p.value < 70)
                        return "#ff4d4f";

                    if(p.value < 85)
                        return "#faad14";

                    return "#52c41a";

                }
            }

        }]

    });

    // 健康矩阵

    const matrix =
        document.getElementById("matrixTable");

    data.devices.forEach(d=>{

        matrix.innerHTML += `

        <tr>

            <td>${d.device}</td>

            <td>${d.runout_score}</td>

            <td>${d.wear_score}</td>

            <td>${d.tool_force_score}</td>

            <td>${d.backlash_score}</td>

            <td>${d.overall}</td>

        </tr>

        `;

    });

    // TOP10风险表

    const riskTable =
        document.getElementById("riskTable");

    data.devices
    .slice(0,10)
    .forEach(d=>{

        riskTable.innerHTML += `

        <tr>

            <td>${d.device}</td>

            <td>${d.overall}</td>

            <td>${d.risk_index}</td>

            <td>${d.risk}</td>

        </tr>

        `;

    });

    // AI建议

    const advice =
        document.getElementById("adviceBox");

    data.devices
    .slice(0,10)
    .forEach(d=>{

        advice.innerHTML += `

        <div class="advice-item">

            <b>${d.device}</b>

            <br>

            综合健康度：
            ${d.overall}

            <br>

            风险指数：
            ${d.risk_index}

            <br>

            趋势评分：
            ${d.trend_score}

            <br>

            建议：
            ${d.suggestion}

        </div>

        `;

    });

    // 雷达图

    const radar =
        echarts.init(
            document.getElementById("radarChart")
        );

    function drawRadar(device){

        radar.setOption({

            tooltip:{},

            radar:{

                indicator:[

                    {name:'主轴跳动',max:100},

                    {name:'主轴磨损',max:100},

                    {name:'拉刀力',max:100},

                    {name:'反向间隙',max:100}

                ]
            },

            series:[{

                type:'radar',

                data:[{

                    value:[

                        device.runout_score,

                        device.wear_score,

                        device.tool_force_score,

                        device.backlash_score

                    ],

                    name:device.device

                }]

            }]

        });

    }

    drawRadar(data.devices[0]);

    healthChart.on("click",function(p){

        let d =
            data.devices.find(
                x=>x.device===p.name
            );

        drawRadar(d);

    });

})

.catch(err => {

    console.error(err);

    alert(
      "data.json读取失败，请按F12查看Console错误。"
    );

});

</script>
